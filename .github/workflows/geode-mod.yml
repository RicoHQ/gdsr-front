name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    paths:
      - "geode-mod/**"
      - ".github/workflows/geode-mod.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-2022
          - name: macOS
            os: macos-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: geode-mod
          combine: true
          sdk: "given"
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: GDSR Geode mod
          path: ${{ steps.build.outputs.build-output }}

      - name: Publish to the "geode-mod" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.build.outputs.build-output }}
        run: |
          ls -la "$OUT"
          if ! gh release view geode-mod --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create geode-mod --repo "$GITHUB_REPOSITORY" --target main --title "GDSR Geode mod" \
              --notes "Download ricohq.gdsr.geode and drop it in your Geode mods folder (or install it from a file in the Geode menu). Works on Windows, macOS and Android."
          fi
          gh release upload geode-mod "$OUT"/*.geode --repo "$GITHUB_REPOSITORY" --clobber
